<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#236B45" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/icon.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
  <title>Mi progreso · BIOISLAS</title>
</head>
<body>
  <aside class="sidebar">
    <a href="/index.html" class="sidebar__brand">
      <img src="/assets/images/logo.svg" alt="" class="sidebar__logo" />
      <span class="sidebar__name">BIOISLAS</span>
    </a>
    <nav class="sidebar__nav" aria-label="Principal">
      <a href="/index.html" class="nav-link" data-nav-link><i data-lucide="home"></i> Inicio</a>
      <a href="/games.html" class="nav-link" data-nav-link><i data-lucide="gamepad-2"></i> Juegos</a>
      <a href="/exam.html" class="nav-link" data-nav-link><i data-lucide="clipboard-check"></i> Examen</a>
      <a href="/manual.html" class="nav-link" data-nav-link><i data-lucide="book-open"></i> Manual</a>
      <a href="/settings.html" class="nav-link" data-nav-link><i data-lucide="settings"></i> Ajustes</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>Mi progreso</h1>
    </div>

    <section class="section">
      <div id="history-empty" class="card text-center" hidden>
        <div class="card__icon" style="margin-inline:auto;"><i data-lucide="info"></i></div>
        <h3 class="card__title">Aún no hay actividades completadas</h3>
        <p class="card__desc">Cuando termines un juego o el examen, tus resultados aparecerán aquí.</p>
        <a href="/games.html" class="btn btn--primary mt-4">Ir a juegos</a>
      </div>

      <div id="history" class="results-history" hidden></div>

      <div class="text-center mt-6">
        <button id="clear-history-btn" class="btn btn--danger" hidden>
          <i data-lucide="trash-2"></i> Borrar historial
        </button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navegación móvil">
    <a href="/index.html" class="bottom-nav__link" data-nav-link><i data-lucide="home"></i><span>Inicio</span></a>
    <a href="/games.html" class="bottom-nav__link" data-nav-link><i data-lucide="gamepad-2"></i><span>Juegos</span></a>
    <a href="/exam.html" class="bottom-nav__link" data-nav-link><i data-lucide="clipboard-check"></i><span>Examen</span></a>
    <a href="/manual.html" class="bottom-nav__link" data-nav-link><i data-lucide="book-open"></i><span>Manual</span></a>
  </nav>

  <script type="module">
    import { initResultsPage } from '/js/pages.js';
    import { renderIcons } from '/js/icons.js';
    initResultsPage().then(() => renderIcons());
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
