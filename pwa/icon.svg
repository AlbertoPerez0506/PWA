<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BIOISLAS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#255941"/>
      <stop offset="100%" stop-color="#7BA685"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2ECE4"/>
      <stop offset="100%" stop-color="#E4EBE7"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Brillo superior (volumen) -->
  <ellipse cx="256" cy="120" rx="200" ry="120" fill="rgba(255,255,255,0.10)"/>

  <!-- Letra B estilizada -->
  <path d="M170 116
           h120
           a76 76 0 0 1 0 152
           a76 76 0 0 1 0 152
           H170
           Z
           M238 172
           v80
           h52
           a40 40 0 0 0 0-80
           Z
           M238 296
           v96
           h58
           a48 48 0 0 0 0-96
           Z"
        fill="url(#letter)"/>

  <!-- Detalle: punto de acento (estrella) -->
  <circle cx="396" cy="128" r="20" fill="#F2B872"/>
</svg>
