<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 600 600" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&amp;display=swap');
      .brand-title { font-family: 'Plus Jakarta Sans', 'Outfit', 'Segoe UI', Arial, sans-serif; font-weight: 800; letter-spacing: 0.06em; }
      .brand-slogan { font-family: 'Plus Jakarta Sans', 'Manrope', 'Segoe UI', Arial, sans-serif; font-weight: 600; letter-spacing: 0.14em; }
    </style>
  </defs>
  
  
    <g transform="translate(160, 55) scale(1.4)">
      <g id="bioislas-emblem">
      <!-- Outer Cellular / Orbital Membrane Arc -->
      <path d="M 156,44 A 80,80 0 1,0 168,142" fill="none" stroke="#239B72" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
      
      <!-- Molecular Route Connecting the 5 Islands -->
      <path d="M 48,144 L 64,92 L 104,108 L 138,76 L 152,44" fill="none" stroke="#239B72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Island 1 (Bottom-Left: Fundamentos) -->
      <circle cx="48" cy="144" r="18" fill="#239B72"/>
      
      <!-- Island 2 (Upper-Left: Instrumentos) -->
      <rect x="44" y="68" width="38" height="38" rx="16" transform="rotate(-12 63 87)" fill="#239B72"/>
      
      <!-- Island 3 (Center Core: Procesos) - Largest central hub -->
      <path d="M 104,76 C 122,76 135,89 135,108 C 135,127 122,140 104,140 C 86,140 73,127 73,108 C 73,89 86,76 104,76 Z" fill="#239B72"/>
      <circle cx="104" cy="108" r="11" fill="#239B72"/>
      
      <!-- Island 4 (Bottom-Right: Palabras) -->
      <rect x="122" y="114" width="36" height="36" rx="15" transform="rotate(18 140 132)" fill="#239B72"/>
      <line x1="104" y1="108" x2="140" y2="132" stroke="#239B72" stroke-width="5" stroke-linecap="round"/>

      <!-- Island 5 (Top-Right Summit: Conocimiento Final / Discovery Node) -->
      <circle cx="150" cy="48" r="22" fill="#239B72"/>
      <circle cx="150" cy="48" r="10" fill="#239B72"/>
      
      <!-- Molecular Waypoint Nodes on Route -->
      <circle cx="48" cy="144" r="5" fill="#239B72"/>
    </g>
    </g>
    <text x="300" y="435" text-anchor="middle" class="brand-title" font-size="76" fill="#239B72">BIOISLAS</text>
    <text x="300" y="482" text-anchor="middle" class="brand-slogan" font-size="21" fill="#239B72">LA RUTA DE LOS BIOPROCESOS</text>
    
</svg>